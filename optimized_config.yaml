system_name: optimized_nanoparticle_network
description: Corrected production baseline for the causal Kirchhoff framework.
network:
  n_junctions: 500
  connection_radius: 0.15
  domain_size:
  - 1.0
  - 1.0
  left_thresh: 0.15
  right_thresh: 0.85
threshold_distribution:
  type: normal
  mean: 7.0
  std: 2.0
  min: 0.0
  max: 20.0
electrical:
  edge_k: 20000000000.0
  resistance_model: node
  # Fixed and independent of Va so activation timing and resistance are not
  # changed together in the mean-Va parameter study.
  node_resistance_ohm: 3500000000.0
voltage_sweep:
  V_start: 0.0
  V_max: 16.0
  V_step: 0.5
  fit_window: 10.0
  target_voltage: 16.0
seeds:
- 41
- 51
- 61
- 71
- 81
output:
  root_folder: IV_results
  save_seed_curves: true
  save_representative_network_plot: true
  fit_R2_mean: 0.9947182028118092
